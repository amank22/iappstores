# Gatus health monitor for iappstores (and the sibling correctmypaper.com site).
# Runs as its own Coolify app on the same Docker network as the iappstores apps, so the
# "internal" checks reach containers by network alias without any public exposure.
# Docs: https://github.com/TwiN/gatus

storage:
  type: sqlite
  path: /data/gatus.db

# Email alerts through Mailtrap's SMTP relay (the API token is the SMTP password, user
# "api"), sent from correctmypaper.com, a domain already verified in Mailtrap.
# GATUS_SMTP_PASSWORD and GATUS_ALERT_EMAIL are environment variables on the Coolify app,
# not stored in this repo.
alerting:
  email:
    from: "noreply@correctmypaper.com"
    username: "api"
    password: "${GATUS_SMTP_PASSWORD}"
    host: "live.smtp.mailtrap.io"
    port: 587
    to: "${GATUS_ALERT_EMAIL}"
    default-alert:
      # Alert after 3 failed checks in a row (about 3 minutes for 1m checks), and send a
      # "resolved" email after 2 passing checks.
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

ui:
  title: iappstores status
  header: iappstores status
  description: Health of the iappstores web app, API and public site.

# Defaults shared by every check below.
x-defaults: &defaults
  interval: 1m
  client:
    timeout: 10s
  ui:
    hide-hostname: true
    hide-url: true
  alerts:
    - type: email

endpoints:
  # --- Internal: container to container on the Coolify network -------------------
  - name: API health
    group: internal
    <<: *defaults
    url: http://iappstores-api-go:4000/health
    conditions:
      - "[STATUS] == 200"
      - "[BODY].ok == true"
      - "[RESPONSE_TIME] < 2000"

  - name: API catalog
    group: internal
    <<: *defaults
    interval: 5m
    url: http://iappstores-api-go:4000/api/apps?pageSize=1
    conditions:
      - "[STATUS] == 200"
      - "[BODY].pagination.totalItems > 1000"
      - "[RESPONSE_TIME] < 5000"

  - name: Web health
    group: internal
    <<: *defaults
    url: http://iappstores-web:3000/health
    conditions:
      - "[STATUS] == 200"
      - "[BODY].ok == true"
      - "[RESPONSE_TIME] < 2000"

  # --- Public: through Cloudflare and the tunnel, the path real users take ------
  - name: iappstores.com
    group: public
    <<: *defaults
    url: https://iappstores.com/
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 168h"

  - name: iappstores.com API
    group: public
    <<: *defaults
    interval: 5m
    url: https://iappstores.com/api/sources
    conditions:
      - "[STATUS] == 200"
      - "len([BODY].sources) > 10"
      - "[RESPONSE_TIME] < 5000"

  - name: correctmypaper.com
    group: public
    <<: *defaults
    url: https://correctmypaper.com/health
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 168h"

  # --- Alert test: off unless GATUS_ALERT_TEST=true on the Coolify app ---------
  # Turn it on and redeploy to check email delivery end to end: it always fails, so
  # an alert email arrives about a minute later. Set it back to false afterwards.
  - name: Alert test
    group: test
    enabled: ${GATUS_ALERT_TEST}
    url: http://127.0.0.1:1/
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: email
        failure-threshold: 1
        success-threshold: 1
        send-on-resolved: false
        description: "test alert: email delivery works"
