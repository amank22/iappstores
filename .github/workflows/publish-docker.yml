name: Publish Docker image

on:
  workflow_run:
    workflows:
      - Verify
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SITE_URL: https://iappstores.com
  API_INTERNAL_URL: http://iappstores-api-go:4000
  COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
  COOLIFY_API_WEBHOOK_URL: ${{ secrets.COOLIFY_API_WEBHOOK_URL }}
  COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
  TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
  TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}

jobs:
  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SITE_URL=${{ env.SITE_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
            API_INTERNAL_URL=${{ env.API_INTERNAL_URL }}

      # Coolify is reached over Tailscale: Cloudflare's Bot Fight Mode challenges
      # GitHub's runner IPs, so the public hostname does not work from CI.
      # COOLIFY_WEBHOOK_URL deploys the web image and COOLIFY_API_WEBHOOK_URL
      # (optional) rebuilds iappstores-api-go from this repo. Both are tailnet
      # URLs: http://<server tailscale ip>:8000/api/v1/deploy?uuid=<app uuid>&force=false
      - name: Connect to Tailscale
        if: ${{ env.COOLIFY_WEBHOOK_URL != '' && env.COOLIFY_API_TOKEN != '' && env.TS_OAUTH_CLIENT_ID != '' && env.TS_OAUTH_SECRET != '' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trigger Coolify deployment
        if: ${{ env.COOLIFY_WEBHOOK_URL != '' && env.COOLIFY_API_TOKEN != '' && env.TS_OAUTH_CLIENT_ID != '' && env.TS_OAUTH_SECRET != '' }}
        run: |
          set -uo pipefail
          status=0
          for url in "${COOLIFY_WEBHOOK_URL}" "${COOLIFY_API_WEBHOOK_URL}"; do
            [ -n "$url" ] || continue
            code=$(curl --silent --show-error --max-time 60 --output /tmp/deploy.json --write-out '%{http_code}' \
              --request POST "$url" \
              --header "Authorization: Bearer ${COOLIFY_API_TOKEN}")
            if [ "${code:0:1}" != "2" ]; then
              echo "Coolify deploy returned HTTP ${code}:"
              cat /tmp/deploy.json
              status=1
            else
              cat /tmp/deploy.json; echo
            fi
          done
          exit $status

      - name: Skip Coolify deployment
        if: ${{ env.COOLIFY_WEBHOOK_URL == '' || env.COOLIFY_API_TOKEN == '' || env.TS_OAUTH_CLIENT_ID == '' || env.TS_OAUTH_SECRET == '' }}
        run: echo "Skipping Coolify deployment because COOLIFY_WEBHOOK_URL, COOLIFY_API_TOKEN, TS_OAUTH_CLIENT_ID or TS_OAUTH_SECRET is not configured."
