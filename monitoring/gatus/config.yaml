# Gatus health monitor for iappstores (and the sibling correctmypaper.com site).
# Runs as its own Coolify app on the same Docker network as the iappstores apps, so the
# "internal" checks reach containers by network alias without any public exposure.
# Docs: https://github.com/TwiN/gatus

storage:
  type: sqlite
  path: /data/gatus.db

# Email alerts through Mailtrap's SMTP relay (the API token is the SMTP password, user
# "api"), sent from correctmypaper.com, a domain already verified in Mailtrap.
# GATUS_SMTP_PASSWORD and GATUS_ALERT_EMAIL are environment variables on the Coolify app,
# not stored in this repo.
alerting:
  email:
    from: "noreply@correctmypaper.com"
    username: "api"
    password: "${GATUS_SMTP_PASSWORD}"
    host: "live.smtp.mailtrap.io"
    port: 587
    to: "${GATUS_ALERT_EMAIL}"
    default-alert:
      # Alert after 3 failed checks in a row (about 3 minutes for 1m checks), and send a
      # "resolved" email after 2 passing checks.
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

ui:
  title: iappstores status
  header: iappstores status
  description: Health of the iappstores web app, API and public site.

# Defaults shared by every check below.
x-defaults: &defaults
  interval: 1m
  client:
    timeout: 10s
  ui:
    hide-hostname: true
    hide-url: true
  alerts:
    - type: email

endpoints:
  # --- Internal: container to container on the Coolify network -------------------
  - name: API health
    group: internal
    <<: *defaults
    url: http://iappstores-api-go:4000/health
    conditions:
      - "[STATUS] == 200"
      - "[BODY].ok == true"
      - "[RESPONSE_TIME] < 2000"

  - name: API catalog
    group: internal
    <<: *defaults
    interval: 5m
    url: http://iappstores-api-go:4000/api/apps?pageSize=1
    conditions:
      - "[STATUS] == 200"
      - "[BODY].pagination.totalItems > 1000"
      - "[RESPONSE_TIME] < 5000"

  - name: Web health
    group: internal
    <<: *defaults
    url: http://iappstores-web:3000/health
    conditions:
      - "[STATUS] == 200"
      - "[BODY].ok == true"
      - "[RESPONSE_TIME] < 2000"

  # The app-data collector (amank22/iappstores-collector), by its Coolify network
  # alias. "Data pipeline" is 200 while the daily run is on schedule (a successful
  # run within 30 hours, or one in progress) and 503 otherwise.
  - name: Collector health
    group: internal
    <<: *defaults
    url: http://iappstores-collector:8080/healthz
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"

  - name: Data pipeline
    group: internal
    <<: *defaults
    interval: 15m
    url: http://iappstores-collector:8080/healthz/pipeline
    conditions:
      - "[STATUS] == 200"
      - "[BODY].ok == true"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true
        description: "the collector's daily pipeline is behind schedule"

  # The private catalog API (read side for the frontends), by its Coolify alias.
  # /healthz checks its database and Valkey cache; /v1/meta proves a catalog is built.
  - name: Catalog API
    group: internal
    <<: *defaults
    interval: 5m
    url: http://iappstores-catalog-api:8080/healthz
    conditions:
      - "[STATUS] == 200"
      - "[BODY].ok == true"
      - "[BODY].cache_ok == true"
      - "[RESPONSE_TIME] < 3000"

  - name: Catalog API data
    group: internal
    <<: *defaults
    interval: 15m
    url: http://iappstores-catalog-api:8080/v1/meta
    conditions:
      - "[STATUS] == 200"
      - "[BODY].directory_ready_apps > 10000"
      - "[RESPONSE_TIME] < 5000"

  # --- Public: through Cloudflare and the tunnel, the path real users take ------
  - name: iappstores.com
    group: public
    <<: *defaults
    url: https://iappstores.com/
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 168h"

  - name: iappstores.com API
    group: public
    <<: *defaults
    interval: 5m
    url: https://iappstores.com/api/sources
    conditions:
      - "[STATUS] == 200"
      - "len([BODY].sources) > 10"
      - "[RESPONSE_TIME] < 5000"

  - name: correctmypaper.com
    group: public
    <<: *defaults
    url: https://correctmypaper.com/health
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 168h"

